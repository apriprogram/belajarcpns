# BISA-PNS — produksi (Caddy + HTTPS otomatis + backup harian)
# Jalankan: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Wajib di .env: DOMAIN, ACME_EMAIL, POSTGRES_PASSWORD, JWT_SECRET
name: bisa-pns-prod

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-bisapns}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
  POSTGRES_DB: ${POSTGRES_DB:-bisapns}
  TZ: Asia/Jakarta

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-bisapns}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bisapns}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi di .env (min. 32 karakter acak)}
      APP_ENV: production
      CORS_ORIGINS: https://${DOMAIN:?DOMAIN wajib diisi di .env}
      UPLOAD_DIR: /app/uploads
      COOKIE_SECURE: "true"
      SEED: ${SEED:-false}
      TZ: Asia/Jakarta
    expose: ["8080"]
    volumes:
      - uploads:/app/uploads
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 10
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  web:
    build:
      context: ./apps/web
      args:
        API_URL: http://api:8080
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8080
      NODE_ENV: production
    expose: ["3000"]
    networks: [internal]
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - web
      - api
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL wajib diisi di .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    logging: *logging

  backup:
    image: postgres:16-alpine
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-bisapns}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-bisapns}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    volumes:
      - ./deploy/backup-loop.sh:/backup-loop.sh:ro
      - ./backups:/backups
    networks: [internal]
    logging: *logging

networks:
  internal:

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

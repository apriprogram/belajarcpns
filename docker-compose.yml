# BISA-PNS — lingkungan lokal/pengembangan
# Jalankan: docker compose up -d --build   → web http://localhost:3000, api http://localhost:8080
name: bisa-pns

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bisapns}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bisapns}
      POSTGRES_DB: ${POSTGRES_DB:-bisapns}
      TZ: Asia/Jakarta
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-bisapns}:${POSTGRES_PASSWORD:-bisapns}@db:5432/${POSTGRES_DB:-bisapns}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-ganti-di-produksi-minimal-32-karakter}
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      UPLOAD_DIR: /app/uploads
      COOKIE_SECURE: "false"
      SEED: ${SEED:-true}
      TZ: Asia/Jakarta
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 10

  web:
    build:
      context: ./apps/web
      args:
        API_URL: http://api:8080
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8080
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  uploads:
